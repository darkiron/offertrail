<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/offertrail.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OfferTrail — Suivi de candidatures et relances</title>
    <meta
      name="description"
      content="OfferTrail rassemble candidatures, contacts recruteurs et relances dans un espace clair. Commencez gratuitement, sans carte bancaire."
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://offertrail.fr/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OfferTrail" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:title"
      content="OfferTrail — Suivez vos candidatures sans perdre le fil"
    />
    <meta
      property="og:description"
      content="Candidatures, contacts recruteurs et relances réunis dans un espace clair."
    />
    <meta property="og:url" content="https://offertrail.fr/" />
    <meta
      property="og:image"
      content="https://offertrail.fr/offertrail-social.svg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="OfferTrail — Pilotez vos candidatures"
    />
    <meta
      name="twitter:description"
      content="Centralisez vos candidatures et ne manquez plus une relance."
    />
    <meta
      name="twitter:image"
      content="https://offertrail.fr/offertrail-social.svg"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "OfferTrail",
        "url": "https://offertrail.fr/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Application de suivi de candidatures, contacts recruteurs et relances.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <script>
      (function () {
        var stored = localStorage.getItem('offertrail.color-scheme');
        var scheme =
          stored ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light');
        document.documentElement.setAttribute(
          'data-mantine-color-scheme',
          scheme,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main
        style="
          max-width: 760px;
          margin: 0 auto;
          padding: 72px 24px;
          font-family: system-ui, sans-serif;
          color: #0f172a;
        "
      >
        <p style="font-weight: 700; color: #0f766e; letter-spacing: 0.08em">
          OFFERTRAIL
        </p>
        <h1
          style="
            font-size: clamp(2.5rem, 7vw, 5rem);
            line-height: 1.02;
            margin: 20px 0;
          "
        >
          Pilotez vos candidatures et vos relances.
        </h1>
        <p style="font-size: 1.2rem; line-height: 1.7; color: #475569">
          Centralisez vos candidatures, vos contacts et vos statistiques dans un
          suivi clair. Commencez gratuitement avec cinq candidatures, sans carte
          bancaire.
        </p>
        <p>
          <a
            href="/register?plan=free&amp;period=monthly"
            style="
              display: inline-block;
              margin-top: 20px;
              padding: 14px 22px;
              border-radius: 999px;
              background: #0f766e;
              color: white;
              text-decoration: none;
              font-weight: 700;
            "
            >Créer un compte gratuit</a
          >
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
